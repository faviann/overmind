name: overmind-codex-capture

services:
  codex-capture:
    image: ${OVERMIND_CAPTURE_IMAGE:?Set an immutable version or digest; no latest default is provided}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Machine-owned connection facts. Omit the credential for browser
      # pairing, or provide an existing restricted credential.
      OVERMIND_CAPTURE_URL: ${OVERMIND_CAPTURE_URL:?Set the central server URL}
      OVERMIND_CAPTURE_CREDENTIAL: ${OVERMIND_CAPTURE_CREDENTIAL:-}
      OVERMIND_CODEX_SESSIONS_ROOT: /capture/sessions
      OVERMIND_CODEX_ARCHIVE_ROOT: /capture/archived_sessions
      OVERMIND_CAPTURE_STATE_DIR: /state
      OVERMIND_CAPTURE_SCAN_INTERVAL_MS: ${OVERMIND_CAPTURE_SCAN_INTERVAL_MS:-1000}
      OVERMIND_CAPTURE_SCAN_JITTER_MS: ${OVERMIND_CAPTURE_SCAN_JITTER_MS:-250}
    # Linux host networking makes the runtime's loopback listener the host's
    # loopback listener without publishing a container port or widening its bind.
    network_mode: host
    volumes:
      - type: bind
        source: ${OVERMIND_CODEX_SESSIONS_ROOT:?Set the machine Codex current sessions root}
        target: /capture/sessions
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OVERMIND_CODEX_ARCHIVE_ROOT:?Set the machine Codex archived sessions root}
        target: /capture/archived_sessions
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OVERMIND_REPOSITORY_ROOT:?Set the machine repository root}
        target: /capture/repository
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: codex-capture-state
        target: /state
    restart: unless-stopped

volumes:
  codex-capture-state:
